
name: Unit EvaGC

on:
  workflow_dispatch:
    inputs:
      script:
        description: "from?"
        required: true
        type: choice
        default: nord
        options:
          - west
          - nord

jobs:
  Unit:
    runs-on: ubuntu-latest

    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      GITHUB_TG_TOKEN: ${{ secrets.TG_TOKEN }}
      GITHUB_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v5

      - name: ⏰ Prepare timezone
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          echo "Asia/Jakarta" | sudo tee /etc/timezone

      - name: 📦 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc cpio flex bison aptitude git python-is-python3 \
            tar aria2 perl wget curl lz4 libssl-dev zip

      - name: ⚙️ Setup Environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

      - name: 🧰 Setup KernelSU
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" \
            | bash -s main

      - name: 🔍 Show Build Selection
        run: |
          echo "Selected script: ${{ inputs.script }}"

          case "${{ inputs.script }}" in
            west)
              echo "Compiler: AOSP Clang 14"
              echo "Clang revision: clang-r450784d"
              ;;
            nord)
              echo "Compiler: AOSP Clang 12"
              echo "Clang revision: clang-r416183b"
              ;;
            *)
              echo "Invalid script selection"
              exit 1
              ;;
          esac

      - name: 🔨 Build Kernel
        run: |
          case "${{ inputs.script }}" in
            west)
              bash west
              ;;
            nord)
              bash nord
              ;;
            *)
              echo "Invalid script selection"
              exit 1
              ;;
          esac
