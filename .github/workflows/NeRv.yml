name: Unit EvaGC

on:
  workflow_dispatch:

jobs:
  Unit:
    runs-on: ubuntu-latest

    env:                               
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # (optional) also expose the same values under the fallback names
      GITHUB_TG_TOKEN: ${{ secrets.TG_TOKEN }}
      GITHUB_TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5

    - name: ⏰ Prepare timezone
      run: |
        sudo rm /etc/localtime
        sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: 📦 Install Dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison aptitude git python-is-python3 \
          tar aria2 perl wget curl lz4 libssl-dev -y

    - name: ⚙️ Setup Environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> $GITHUB_ENV

    - name: 📥 Build Kernel
      run:  |
        curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
        bash nord
      # the env block above already makes TG_TOKEN/TG_CHAT_ID visible here
